
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FraudShield - Login</title>

    <link rel="stylesheet" href="Login.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>

        <div class="logo">
            🛡 Fraud<span>Shield</span>
        </div>

        <a href="Faurd_Homepage.html" class="home-btn">Back to Home</a>

    </header>


    <!-- Login Section -->
    <section class="login-section">

        <div class="login-container">

            <div class="login-icon">🔐</div>

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login to your FraudShield account
            </p>


            <!-- Login Form -->
             <form action="http://localhost:8080/FaurdSheild/LoginServlet" method="post">
          
                <form id="loginForm" action="#" method="post">

                <div class="input-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-options">

                    <label>
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>


                <button type="submit" class="login-button">
                    Login
                </button>

            </form>


            <p class="register-link">
                Don't have an account?
                <a href="register.html">Register Now</a>
            </p>


            <a href="index.html" class="back-link">
                ← Back to Homepage
            </a>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 FraudShield. Educational Project Demo.
        </p>

    </footer>

        <script src="login.js"></script>

</body>

</html>
